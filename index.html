<style>
        :root {
            --bg-main: #0a0e17; 
            --bg-card: #111827; 
            --bg-card-hover: #1f2937;
            --accent-color: #00ffcc; 
            --accent-glow: rgba(0, 255, 204, 0.4);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            
            --font-main: 'Inter', sans-serif;
            --font-tech: 'Fira Code', monospace;
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Rimuove l'evidenziazione blu al tap su iOS */
            -webkit-tap-highlight-color: transparent; 
        }

        html {
            scroll-behavior: smooth;
            /* Previene il ridimensionamento automatico del testo ruotando l'iPhone */
            -webkit-text-size-adjust: 100%; 
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
            /* Ottimizza la nitidezza dei font su macOS/iOS */
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 14, 23, 0.85);
            /* Aggiunto prefisso -webkit- per Safari */
            -webkit-backdrop-filter: blur(10px); 
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-tech);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Usiamo media (hover: hover) per evitare che lo stato hover rimanga bloccato su iOS dopo il tap */
        @media (hover: hover) {
            .nav-links a:hover {
                color: var(--accent-color);
            }
        }

        .menu-toggle {
            display: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-family: var(--font-tech);
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: var(--text-primary);
            display: inline-block;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -10px;
            width: 60%;
            height: 4px;
            background: var(--accent-color);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .hero {
            /* Fix per l'altezza su iOS Safari: usa min-height e l'unità dinamica dvh */
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 1.5rem;
        }

        .hero-prefix {
            font-family: var(--font-tech);
            color: var(--accent-color);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .hero .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--text-secondary);
            font-family: var(--font-tech);
            margin-bottom: 2rem;
            min-height: 3rem; 
        }

        .typing-cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--accent-color);
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            font-family: var(--font-tech);
            text-decoration: none;
            font-size: 1rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        @media (hover: hover) {
            .btn:hover {
                background: rgba(0, 255, 204, 0.1);
                box-shadow: 0 0 15px var(--accent-glow);
                transform: translateY(-3px);
            }
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .about-content p {
            margin-bottom: 1.5rem;
        }

        .highlight {
            color: var(--accent-color);
            font-weight: 600;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
        }

        .tech-tags span {
            background: var(--bg-card);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-family: var(--font-tech);
            font-size: 0.9rem;
            border: 1px solid rgba(0, 255, 204, 0.2);
            transition: var(--transition);
        }

        @media (hover: hover) {
            .tech-tags span:hover {
                border-color: var(--accent-color);
                box-shadow: 0 0 10px var(--accent-glow);
            }
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 2rem;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-color);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-10px);
                background: var(--bg-card-hover);
                box-shadow: 0 10px 30px -15px rgba(0, 255, 204, 0.2);
            }

            .card:hover::before {
                transform: scaleX(1);
            }
        }

        .card-icon {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            flex-grow: 1;
        }
        
        .hobby-list {
            margin-top: 1rem;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .hobby-list li {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .hobby-list li i {
            color: var(--accent-color);
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .contact-section {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-section p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-outline {
            background: rgba(0, 255, 204, 0.05);
            border: 1px dashed var(--accent-color);
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            color: var(--accent-color);
            text-decoration: none;
            font-family: var(--font-tech);
            font-size: 0.9rem;
            transition: var(--transition);
            text-transform: uppercase;
        }

        @media (hover: hover) {
            .card-link:hover {
                gap: 0.8rem;
                text-shadow: 0 0 8px var(--accent-glow);
            }
        }

        .podcast-links {
            display: flex;
            gap: 1.2rem;
            margin-top: auto;
            padding-top: 1.5rem;
        }

        .podcast-links a {
            color: var(--text-secondary);
            font-size: 1.5rem;
            transition: var(--transition);
        }

        @media (hover: hover) {
            .podcast-links a:hover {
                color: var(--accent-color);
                transform: translateY(-3px);
                text-shadow: 0 0 8px var(--accent-glow);
            }
        }

        .social-grid {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-top: 3.5rem;
            flex-wrap: wrap;
        }

        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: var(--font-tech);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .social-item i {
            font-size: 2.5rem;
            color: var(--text-primary);
            transition: var(--transition);
        }

        @media (hover: hover) {
            .social-item:hover i, .social-item:hover {
                color: var(--accent-color);
                transform: translateY(-5px);
            }
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--bg-card);
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 4rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .social-links a {
            color: var(--text-secondary);
            font-size: 1.5rem;
            transition: var(--transition);
        }

        @media (hover: hover) {
            .social-links a:hover {
                color: var(--accent-color);
                transform: translateY(-3px);
            }
        }

        .copyright {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-family: var(--font-tech);
        }

        @media (max-width: 768px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(10, 14, 23, 0.95);
                /* Aggiunto backdrop filter al menu mobile */
                -webkit-backdrop-filter: blur(15px);
                backdrop-filter: blur(15px);
                flex-direction: column;
                align-items: center;
                padding: 2rem 0;
                gap: 1.5rem;
                transform: translateY(-150%);
                transition: transform 0.3s ease;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                z-index: -1;
            }

            .nav-links.active {
                transform: translateY(0);
            }

            .menu-toggle {
                display: block;
            }

            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
